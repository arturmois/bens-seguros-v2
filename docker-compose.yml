# Local development services. The apps run on the host with `pnpm dev`.
name: bens-seguros

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: bens
      POSTGRES_PASSWORD: bens
      POSTGRES_DB: bens
      # Password of the application role created by docker/postgres/init on a fresh volume.
      APP_DB_PASSWORD: bens_app
    ports:
      - '5432:5432'
    volumes:
      - postgres-data:/var/lib/postgresql
      # Creates the application role on a fresh volume (ADR-004).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bens -d bens']
      interval: 5s
      timeout: 3s
      retries: 10

  # SMTP sink with a web inbox at http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.2
    ports:
      - '1025:1025'
      - '8025:8025'

volumes:
  postgres-data:
