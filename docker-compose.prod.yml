# Production and staging (ADR-008): one host, same origin. Caddy serves the SPA and proxies /api and
# /socket.io to the server; only Caddy is reachable from outside.
#   docker compose -f docker-compose.prod.yml --env-file .env up -d --build
# Variables: .env.prod.example. Runbook: docs/runbooks/staging.md.
name: bens-seguros-prod

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
      # The application role is created on the first boot of the volume (ADR-004).
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?}
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 20

  # One-shot: applies the migrations as the table owner, then exits. The server waits for it.
  migrate:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: migrate
    restart: 'no'
    environment:
      MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    depends_on:
      postgres:
        condition: service_healthy

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
      target: runtime
    restart: unless-stopped
    # No published port: only Caddy reaches it, which is what makes TRUST_PROXY safe.
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: '3001'
      LOG_LEVEL: ${LOG_LEVEL:-info}
      TRUST_PROXY: 'true'
      APP_URL: ${APP_URL:?}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?}
      DATABASE_URL: postgresql://bens_app:${APP_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_REGION: ${S3_REGION:-auto}
      S3_BUCKET: ${S3_BUCKET:?}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      SMTP_URL: ${SMTP_URL:?}
      EMAIL_FROM: ${EMAIL_FROM:?}
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3001/api/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 6
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}
      HTTP_PORT: ${HTTP_PORT:-80}
      HTTPS_PORT: ${HTTPS_PORT:-443}
    ports:
      - '${HTTP_PORT:-80}:${HTTP_PORT:-80}'
      - '${HTTPS_PORT:-443}:${HTTPS_PORT:-443}'
      - '${HTTPS_PORT:-443}:${HTTPS_PORT:-443}/udp'
    volumes:
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - server

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
